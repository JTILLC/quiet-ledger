<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Quiet Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --page:#c3cac4; --text:#1f2a36; --muted:#4f5b66;
  --paper:#e4e9dc; --rule:#a9bccd; --margin:#b0473f;
  --ink:#1d2b4a; --void:#2b3137; --voidtext:#dfe3d6; --dim:#a9b2b8;
  --slip:#eef1e7; --slipline:#c5cfbf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#1b2025; --text:#d9ded3; --muted:#9aa5ad; --paper:#cfd5c6; --rule:#97aabb; --void:#11151a; }
}
:root[data-theme="dark"]{ --page:#1b2025; --text:#d9ded3; --muted:#9aa5ad; --paper:#cfd5c6; --rule:#97aabb; --void:#11151a; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--text);
  font-family:"IM Fell English","Iowan Old Style",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5}
.app{max-width:1120px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;padding:28px}}
.stage{position:relative;background:var(--void);border-radius:3px;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges}
#street{cursor:pointer;transition:filter 2.8s ease}
#street:focus-visible{outline:3px solid var(--margin);outline-offset:-3px}
#over{position:absolute;top:0;left:0;width:100%;pointer-events:none}
.narration{min-height:7.5em;padding:14px 2px 0}
.narration p{margin:0 0 10px;max-width:62ch;white-space:pre-line}
.choices{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-size:17px;color:var(--ink);background:var(--slip);border:1px solid var(--slipline);border-radius:2px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled){background:#fff}
button:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.hint{font-style:italic;color:var(--muted);font-size:15px;margin:6px 2px 0}

/* battle */
.battle{color:var(--voidtext);padding:18px 18px 20px;display:none}
.battle.on{display:block}
.battle h2{font-weight:400;font-style:italic;font-size:26px;margin:0}
.bar{display:flex;gap:2px;max-width:280px;margin:4px 0}
.bar span{flex:1;height:10px;background:#3d454c}
.bar.foe span.f{background:#b9a27a}
.bar.you span.f{background:#9fb3c8}
.row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15.5px;color:var(--dim)}
.intent{border-left:2px solid var(--margin);padding:2px 0 2px 10px;margin:10px 0;font-size:16px}
.intent.hidden{border-color:#555;color:var(--dim);font-style:italic}
.held{font-size:15px;color:#d9b38c;margin:0}
.log{font-style:italic;min-height:1.5em;margin:10px 0 12px;color:#e8e2cf}
.you{margin-top:14px;padding-top:12px;border-top:1px solid #3d454c}
.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 12px}
.card{text-align:left;display:flex;flex-direction:column;gap:2px;padding:9px 11px;background:var(--slip);border-left:4px solid var(--ink)}
.card.found{border-left-color:var(--margin)}
.card b{font-weight:400;font-size:17.5px}
.card small{font-size:14px;color:#46525d;line-height:1.35}
.card i{font-size:13.5px;color:var(--margin)}
.card .cost{font-size:12px;color:var(--ink);letter-spacing:2px;min-height:1em}
.card.dark{background:#3a3f45;border-color:#4a5057;border-left-color:#6a6f74;color:#cfd3c8}
.card.dark:hover:not(:disabled){background:#454b52}
.card.dark small{color:#a9b2b8}
.card.dark .cost{color:#e0c48a}

/* ledger / binder */
.ledger{background:var(--paper);color:var(--ink);padding:22px 22px 26px 0;border-radius:2px;box-shadow:6px 6px 0 -1px #00000012}
.ledger h1{font-weight:400;font-style:italic;font-size:30px;margin:0 0 4px;padding-left:64px}
.ledger .sub{padding-left:64px;margin:0 0 12px;font-size:15px;color:var(--muted)}
.ledger ol{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:48px 1fr;column-gap:16px;min-height:2.6em;padding:.4em 0;border-bottom:1px solid var(--rule)}
.ledger li .n{border-right:2px solid var(--margin);text-align:right;padding-right:10px;color:var(--muted);font-size:15px;line-height:1.7}
.ledger li .t{font-style:italic;font-size:19px;line-height:1.35}
.ledger li .s{display:block;font-style:normal;font-size:14.5px;color:var(--muted)}
.ledger li.new .t{animation:ink 1.6s ease}
@keyframes ink{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.ledger li .t.phantom{color:var(--margin);opacity:0;animation:phantom 7s ease forwards}
@keyframes phantom{0%{opacity:0;filter:blur(2px)}30%{opacity:.6;filter:none}70%{opacity:.45}100%{opacity:0;filter:blur(3px)}}
.ledger li.foreign .t{font-style:normal;color:var(--margin);letter-spacing:.4px}
.battle.faint{animation:faint 2.6s ease-in-out infinite}
.battle.faint .card b,.battle.faint .card small{animation:waver 3.1s ease-in-out infinite}
@keyframes faint{50%{box-shadow:inset 0 0 70px 26px #000}}
@keyframes waver{50%{filter:blur(.6px);opacity:.75}}
.under{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
button.mini{font-size:14px;padding:3px 10px;color:var(--muted);background:transparent;border-color:var(--rule)}
@media (prefers-reduced-motion: reduce){#street{transition:none}.ledger li.new .t,.ledger li .t.phantom,.battle.faint,.battle.faint .card b,.battle.faint .card small{animation:none}.ledger li .t.phantom{opacity:.5}}
</style>
</head>
<body>
<main class="app">
  <section aria-label="The street">
    <div class="stage">
      <canvas id="street" width="192" height="128" tabindex="0" style="filter:grayscale(1) contrast(.85)" aria-label="The street. Use arrow keys to walk, or tap a place."></canvas>
      <canvas id="over" width="192" height="128" aria-hidden="true"></canvas>
      <div class="battle" id="battle" aria-live="polite"></div>
    </div>
    <div class="narration" aria-live="polite"><p id="say"></p><div class="choices" id="choices"></div></div>
    <div class="under"><p class="hint" id="hint">Arrow keys or WASD to walk, or tap the street. Walk into things to look at them.</p><button class="mini" id="sound" aria-pressed="true">Sound on</button></div>
  </section>
  <aside class="ledger" aria-label="The ledger">
    <h1>The Quiet Ledger</h1>
    <p class="sub" id="sub">What you hold is what you can see.</p>
    <ol id="entries"></ol>
  </aside>
</main>
<script>
/* ===== Tuning (isolated) ===== */
const TUNING = {
  tile:16, cols:12, rows:8, stepMs:105,
  hp:14, will:3, draw:4, lightCost:1,
  shadeHp:34, shadeGrips:[23,12],
  bakerEvery:5, phantomEveryMs:[28000,55000],
  chandlerHp:40, chandlerGrips:[26,13], chandlerDark:1,
  grayByFound:[1,.8,.6,.45,.3,.2,.1,0],
};

/* ===== Content ===== */
const CARDS = {
  pen:   {name:"Clerk's pen",    cost:1, battle:"Deal 3.", starter:true},
  still: {name:"Hold still",     cost:1, battle:"Block 4.", starter:true},
  flower:{name:"Pressed flower", cost:1, battle:"Regain 3 presence.", sight:"Maren, at the well", reveal:"Lets you see Maren, at the well."},
  coin:  {name:"Cold coin",      cost:1, battle:"Deal 2. Its next attack is 3 weaker.", sight:"the traces it leaves", reveal:"Lets you see the traces it leaves."},
  ribbon:{name:"Burned ribbon",  cost:2, battle:"Deal 7.", sight:"the shade itself", reveal:"Lets you see the shade itself."},
  glance:{name:"Maren's glance", cost:0, battle:"Draw 2.", sight:"lets Maren see you", reveal:"Lets Maren see you, a little.", keep:true},
  taper: {name:"Chapel taper",   cost:0, battle:"Light every card in your hand. Draw 1.", sight:"what's written in the dark", reveal:"Lets you read what's written in the dark."},
  name:  {name:"Your own name",  cost:1, battle:"Deal 3. Block 3. It can't be taken.", sight:"yourself", reveal:"Lets you see yourself. Lets Maren hear you.", keep:true},
  candle:{name:"Lit candle",     cost:1, battle:"Deal 4. Light a card.", sight:"the people in the pews", reveal:"Lets you see the people in the pews."},
};
const STARTER = ["pen","pen","pen","still","still","still"];
const PICKUPS = {
  flower:{scene:"street",x:3,y:4,needs:null,step:true},
  coin:  {scene:"street",x:6,y:5,needs:"flower",inWell:true},
  ribbon:{scene:"street",x:10,y:5,needs:"coin",step:true},
  taper: {scene:"chapel",x:1,y:2,needs:null},
  name:  {scene:"chapel",x:10,y:2,needs:"taper"},
};
const SHADE_INTENTS = [
  {kind:"lunge", dmg:6, seen:"Maren's eyes go to your throat. It will lunge for 6."},
  {kind:"grasp", dmg:3, seen:"Maren's eyes go to your hands. It will tear a card away (3 damage)."},
  {kind:"smother", dmg:9, seen:"Maren covers her mouth. It will smother you for 9."},
  {kind:"lunge", dmg:7, seen:"Maren's eyes go to your throat. It will lunge for 7."},
];
const CHANDLER_INTENTS = [
  {kind:"snuff", dmg:3, seen:"It lifts its snuffer toward you. 3 damage, and your whole next hand comes up dark."},
  {kind:"melt", dmg:7, seen:"It tips a candle over your head. Hot wax for 7."},
  {kind:"grasp", dmg:2, seen:"It twists a wick between its fingers. It will draw a card into a candle (2 damage)."},
  {kind:"melt", dmg:8, seen:"It tips two candles at once. Hot wax for 8."},
];
const FOES = {
  shade:{name:"The tallow shade", hp:TUNING.shadeHp, grips:TUNING.shadeGrips, intents:SHADE_INTENTS, dark:0,
    opening:"Every card you hold is a way of seeing it. It knows that.",
    win:"It comes apart like smoke through a keyhole.", lose:"It pushes you out of itself.",
    verbs:{lunge:"lunges",grasp:"reaches into you",smother:"smothers you"}, take:n=>`It tears away your ${n}.`},
  chandler:{name:"The Chandler", hp:TUNING.chandlerHp, grips:TUNING.chandlerGrips, intents:CHANDLER_INTENTS, dark:TUNING.chandlerDark,
    opening:"It pinches out the light around your hands. A dark card has to be brought into the light before you can play it.",
    win:"It sags into its own wax and goes out.", lose:"It sets you on a shelf with the other candles, and you go out.",
    verbs:{snuff:"snuffs the light around you",melt:"pours hot wax over you",grasp:"winds a wick around your wrist"}, take:n=>`It draws your ${n} into a candle.`},
};
const SPOT = { records:{x:2,y:2}, bakeryDoor:{x:6,y:2}, chapel:{x:9,y:2}, well:{x:6,y:5}, maren:{x:7,y:5}, shade:{x:9,y:3}, baker:{x:5,y:3} };
const CHAPEL = {
  entry:{x:6,y:6}, door:[{x:5,y:7},{x:6,y:7}], altar:[{x:5,y:1},{x:6,y:1}],
  stand:{x:1,y:2}, lectern:{x:10,y:2}, chandler:{x:6,y:2},
  pews:[[2,3],[3,3],[4,3],[7,3],[8,3],[9,3],[2,5],[3,5],[4,5],[7,5],[8,5],[9,5]],
  ghosts:[
    {x:3,y:3, look:{hair:"#cfcfcf",face:"#d9b49a",coat:"#4a4a52"},
      dim:"A shape in the pew, like breath on glass. Maybe a man with his hat in his lap.",
      lit:"Old Tobin, the lamplighter, hat in his lap. “Is it evening yet?” he asks no one in particular."},
    {x:8,y:3, look:{hair:"#d8b46a",face:"#ecc9ae",coat:"#6f5a7a"},
      dim:"A small shape in a Sunday collar.",
      lit:"Ada Hale, in her Sunday collar, counting the candles under her breath. She gets to nine and starts again."},
    {x:2,y:5, look:{hair:"#4a3020",face:"#c99a78",coat:"#5a4a32"},
      dim:"Someone broad-shouldered, leaning forward as if to pray.",
      lit:"Brenner the cooper, sawdust still in his sleeves. He's watching the door like he means to leave."},
    {x:9,y:5, look:null,
      dim:"This pew is empty, but the cushion is worn into a shallow. Someone sat here every week.",
      lit:"Still empty. It was yours."},
  ],
};

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const has=(s,id)=>s.found.includes(id);
const shadeVisible=s=>has(s,"ribbon")&&!s.won;
const chandlerVisible=s=>has(s,"name")&&!s.chapelWon;

function initialState(){
  return { mode:"street", scene:"street", player:{x:2,y:3}, found:[], won:false, chapelWon:false,
    baker:{...SPOT.baker}, bakerTick:0, looks:{},
    say:{text:"You wake standing in the middle of a street. No one is here. Your breath doesn't fog. Near the records room, one small thing still has colour in it.",choices:[]},
    battle:null };
}

function thingAt(x,y,s){
  const at=p=>p.x===x&&p.y===y;
  if(s.scene==="chapel"){
    if(CHAPEL.door.some(at)) return "door";
    if(CHAPEL.altar.some(at)) return "altar";
    if(at(CHAPEL.stand)) return "stand";
    if(at(CHAPEL.lectern)) return "lectern";
    if(at(CHAPEL.chandler)&&chandlerVisible(s)) return "chandler";
    const gi=CHAPEL.ghosts.findIndex(at); if(gi>=0) return "ghost"+gi;
    if(CHAPEL.pews.some(([px,py])=>px===x&&py===y)) return "pew";
    return null;
  }
  if(at(SPOT.well)) return "well";
  if(at(SPOT.maren)&&has(s,"flower")) return "maren";
  if(at(SPOT.shade)&&shadeVisible(s)) return "shade";
  if(at(s.baker)&&s.won) return "baker";
  for(const k of ["records","bakeryDoor","chapel"]) if(at(SPOT[k])) return k;
  return null;
}
function walkable(x,y,s){
  const top=s.scene==="chapel"?2:3;
  if(x<1||x>10||y<top||y>6) return false;
  const t=thingAt(x,y,s); return !t;
}
// The baker never moves while you're near him. Walk away and he's a step closer when you look back.
const BAKER_AVOID=[[2,3],[6,3],[9,3],[3,4],[10,5]];
function creep(s){
  if(s.scene!=="street"||!s.won) return;
  const b=s.baker, p=s.player, dx=p.x-b.x, dy=p.y-b.y;
  s.bakerTick++;
  if(Math.abs(dx)+Math.abs(dy)<4||s.bakerTick<TUNING.bakerEvery) return;
  s.bakerTick=0;
  const tries=[[Math.sign(dx),0],[0,Math.sign(dy)]].filter(([x,y])=>x||y);
  if(Math.abs(dy)>Math.abs(dx)) tries.reverse();
  for(const [mx,my] of tries){
    const nx=b.x+mx, ny=b.y+my;
    if(walkable(nx,ny,s)&&!BAKER_AVOID.some(([ax,ay])=>ax===nx&&ay===ny)){ s.baker={x:nx,y:ny}; return; }
  }
}
const looked=(s,id)=>(s.looks[id]=(s.looks[id]||0)+1)-1;

function pickupAvailable(s,id){ const p=PICKUPS[id]; return !has(s,id)&&(!p.needs||has(s,p.needs)); }

function say(s,text,choices=[]){ s.say={text,choices}; return s; }
const fight=foe=>[{label:"Face it",action:{type:"START_BATTLE",foe}},{label:"Back away",action:{type:"DISMISS"}}];

function pickup(s,id){
  s.found.push(id); s.lastFound={id,at:Date.now()};
  if(id==="flower") return say(s,"A pressed flower, violet gone to brown. The moment your hand closes on it, there is a woman by the well who was not there before. She doesn't blink. She's staring at the chapel steps.");
  if(id==="coin") return say(s,"At the bottom of the dry well, a coin so cold it burns. Now you can see frost crossing the cobbles near the chapel, one patch at a time, and the woman's eyes following it.");
  if(id==="ribbon") return say(s,"A ribbon, burned at one end. You close your hand on it and the thing on the chapel steps is suddenly there: tall, smoke and old tallow. It turns its head. For the first time, something on this street sees you.",fight("shade"));
  if(id==="taper") return say(s,"You take a taper from the stand and light it from the one candle still burning. The dark steps back a little. Across the chapel, something on the lectern catches the light.");
  if(id==="name") return say(s,"You hold the taper over the register and the wax goes soft. Names, a long column of them: everyone on this street. Near the bottom is yours. Someone has been writing over it in tallow, night after night.\n\nYou say it out loud. It's the first sound you've made since you woke. At the altar, something tall straightens up from its work, a fistful of half-made candles in its hands. It heard you too.",fight("chandler"));
}

function interact(s,id){
  if(id.startsWith("ghost")){ const g=CHAPEL.ghosts[+id.slice(5)]; return say(s,s.chapelWon?g.lit:g.dim); }
  switch(id){
    case "records": return say(s,[
      "The records room. A desk, a ledger, and a chair worn to the shape of someone who sat there a long time.",
      "The ledger on the desk is open to today. The last entry is in your handwriting. The ink is still wet.",
      "The chair is still warm.",
    ][Math.min(looked(s,"records"),2)]);
    case "bakeryDoor":{
      const n=looked(s,"bakeryDoor");
      if(n===0) return say(s,"The bakery door doesn't open. It has no inside yet.");
      if(n===1) return say(s,"You knock. After a moment, from the other side, something knocks back. Twice. Then it waits for you to answer.");
      return say(s,"You don't knock this time. Something on the other side does, very softly, at the height of your face.");
    }
    case "well":
      if(pickupAvailable(s,"coin")) return pickup(s,"coin");
      if(!has(s,"coin")) return say(s,"The well is dry. The rope goes down and stops at nothing.");
      return say(s,looked(s,"well")===0?"Dry. Something down there used to be cold."
        :"You lean over the edge and hold your breath. At the bottom, something keeps breathing. It's in time with you. It's in time with you even now.");
    case "maren":
      if(s.chapelWon){ s.mode="end"; return say(s,"Maren turns before you reach her. “You said your name in there,” she says. “I heard it all the way out at the well. I'd forgotten I knew it.”\n\nShe looks right at you now, not near you. Behind her, the bakery door has swung open. It has an inside now, warm and full of bread. That's for another night.",[{label:"Begin again",action:{type:"RESET"}}]); }
      if(s.won) return say(s,"She looks at you, or near you, the way you'd look at someone through a fogged window. “You're the clerk. You've stood at that desk three winters. I thought you were frost on the glass.”");
      if(has(s,"ribbon")) return say(s,"“It's on the steps,” she whispers. Not to you. She doesn't know you're here.");
      if(has(s,"coin")) return say(s,"She shivers as you come close and pulls her shawl tight. She's looking past you, at the frost.");
      return say(s,"She doesn't move. Her breath fogs in the cold. Yours doesn't.");
    case "shade": return say(s,"It waits on the chapel steps, and it is watching you.",fight("shade"));
    case "baker":
      if(s.baker.x===SPOT.baker.x&&s.baker.y===SPOT.baker.y) return say(s,"A baker, frozen mid-step with a tray of loaves. His eyes are on you. They were on you before you turned around.");
      return say(s,"He's still mid-step, tray held out toward you. He was by the bakery. You're sure he was by the bakery.");
    case "chapel":
      if(s.won){ s.scene="chapel"; s.player={...CHAPEL.entry};
        return say(s,s.chapelWon?"Back inside. The candles burn steady now, and the people in the pews are easy to see."
          :"Inside, the chapel is colder than the street, and dark. You can only see what's close to you. Faint shapes sit in the pews, like breath on glass. By the door, one candle is still burning."); }
      return say(s,"The chapel door won't open. Something is holding it shut from your side of things.");
    case "door": s.scene="street"; s.player={x:SPOT.chapel.x,y:SPOT.chapel.y+1};
      return say(s,s.chapelWon?"You step out onto the cobbles. The street looks warmer than you left it.":"You step back out onto the cobbles.");
    case "altar":
      if(chandlerVisible(s)) return say(s,"The Chandler stands over the altar, working the wax.",fight("chandler"));
      return say(s,s.chapelWon?"The altar candles burn evenly now, one for every name in the register."
        :"The altar is crowded with half-made candles. Each has a scrap of paper pressed into the wax, a few letters showing.");
    case "stand":
      if(pickupAvailable(s,"taper")) return pickup(s,"taper");
      return say(s,"One candle still burns on the stand. You've taken what light you can carry.");
    case "lectern":
      if(pickupAvailable(s,"name")) return pickup(s,"name");
      if(has(s,"name")) return say(s,"The register. Your name is still there under the wax, if you look for it.");
      return say(s,"A register lies open on the lectern, but a skin of wax covers the page. In this dark you can't make out a single word.");
    case "chandler": return say(s,"It waits by the altar, rolling a wick between finger and thumb. It hasn't taken its eyes off you.",fight("chandler"));
    case "pew": return say(s,"An empty stretch of pew.");
  }
  return s;
}

function drawCards(b,n){
  for(let i=0;i<n;i++){
    if(!b.draw.length){ b.draw=shuffle(b.discard); b.discard=[]; }
    if(!b.draw.length) break;
    b.hand.push(b.draw.pop()); b.dark.push(false);
  }
}
function darken(b,n){ for(const i of shuffle(b.hand.map((_,i)=>i)).slice(0,n)) b.dark[i]=true; }

function reduce(prev,a){
  const s=structuredClone(prev);
  switch(a.type){
    case "STEP":{
      if(s.mode!=="street") return prev;
      const x=s.player.x+a.dx, y=s.player.y+a.dy;
      if(walkable(x,y,s)){
        s.player={x,y}; s.say={text:s.say.text,choices:[]}; creep(s);
        for(const [id,p] of Object.entries(PICKUPS)) if(p.step&&p.scene===s.scene&&p.x===x&&p.y===y&&pickupAvailable(s,id)) return pickup(s,id);
        return s;
      }
      const t=thingAt(x,y,s); return t?interact(s,t):prev;
    }
    case "DISMISS": return say(s,"");
    case "START_BATTLE":{
      const foe=FOES[a.foe];
      s.mode="battle"; s.say={text:"",choices:[]};
      const b={foe:a.foe,hp:TUNING.hp,maxHp:TUNING.hp,block:0,will:TUNING.will,hand:[],dark:[],draw:shuffle([...STARTER,...s.found]),discard:[],taken:[],
        foeHp:foe.hp,foeMax:foe.hp,turn:0,weaken:0,snuffed:false,grips:[...foe.grips],over:null,log:foe.opening};
      drawCards(b,TUNING.draw); darken(b,foe.dark); s.battle=b; return s;
    }
    case "LIGHT":{
      const b=s.battle; if(!b||b.over||!b.dark[a.i]||b.will<TUNING.lightCost) return prev;
      b.will-=TUNING.lightCost; b.dark[a.i]=false; b.log=`You bring the ${CARDS[b.hand[a.i]].name.toLowerCase()} into the light.`;
      return s;
    }
    case "PLAY":{
      const b=s.battle; if(!b||b.over||b.dark[a.i]) return prev;
      const id=b.hand[a.i], c=CARDS[id]; if(!c||c.cost>b.will) return prev;
      b.will-=c.cost; b.hand.splice(a.i,1); b.dark.splice(a.i,1); b.discard.push(id);
      const blind=b.foe==="shade"&&b.taken.includes("ribbon");
      const hit=n=>{ const d=blind?Math.floor(n/2):n; b.foeHp=Math.max(0,b.foeHp-d); return d; };
      if(id==="pen") b.log=`You strike with the pen. ${hit(3)} damage${blind?", swinging blind":""}.`;
      if(id==="still"){ b.block+=4; b.log="You hold still and it loses track of you. Block 4."; }
      if(id==="flower"){ b.hp=Math.min(b.maxHp,b.hp+3); b.log="You remember her face. Presence +3."; }
      if(id==="coin"){ const d=hit(2); b.weaken+=3; b.log=`The coin's cold bites into it. ${d} damage, and it slows.`; }
      if(id==="ribbon") b.log=`You lash it with the burned ribbon. ${hit(7)} damage.`;
      if(id==="glance"){ drawCards(b,2); b.log="Maren looks your way. You draw 2."; }
      if(id==="taper"){ b.dark=b.dark.map(()=>false); drawCards(b,1); b.log="The taper flares. Every card in your hand comes into the light, and you draw 1."; }
      if(id==="name"){ const d=hit(3); b.block+=3; b.log=`You say your name. ${d} damage, and block 3.`; }
      if(id==="candle"){ const d=hit(4), j=b.dark.indexOf(true); if(j>=0) b.dark[j]=false; b.log=`The candle's flame licks at it. ${d} damage${j>=0?", and a dark card comes into the light":""}.`; }
      while(b.grips.length && b.foeHp<=b.grips[0]){
        b.grips.shift();
        if(b.taken.length){ const r=b.taken.pop(); b.discard.push(r); b.log+=` It loses its grip on the ${CARDS[r].name.toLowerCase()}.`; }
      }
      if(b.foeHp<=0){ b.over="won"; b.log=FOES[b.foe].win; }
      return s;
    }
    case "END_TURN":{
      const b=s.battle; if(!b||b.over) return prev;
      const foe=FOES[b.foe], it=foe.intents[b.turn%foe.intents.length];
      b.discard.push(...b.hand); b.hand=[]; b.dark=[];
      let note="";
      if(it.kind==="grasp"){
        const pool=[...b.draw.map((id,i)=>({id,from:"draw",i})),...b.discard.map((id,i)=>({id,from:"discard",i}))].filter(p=>!CARDS[p.id].keep);
        const pref=pool.filter(p=>!CARDS[p.id].starter), from=pref.length?pref:pool, pick=from[Math.floor(Math.random()*from.length)];
        if(pick){ b[pick.from].splice(pick.i,1); b.taken.push(pick.id); note=" "+foe.take(CARDS[pick.id].name.toLowerCase());
          if(b.foe==="shade"&&pick.id==="flower") note+=" Maren flickers out of the world.";
          if(b.foe==="shade"&&pick.id==="ribbon") note+=" It slips half out of sight."; }
      }
      if(it.kind==="snuff") b.snuffed=true;
      const dmg=Math.max(0,it.dmg-b.weaken); b.weaken=0;
      const through=Math.max(0,dmg-b.block); b.hp=Math.max(0,b.hp-through); b.block=0; b.turn++;
      b.log=`It ${foe.verbs[it.kind]}. You lose ${through} presence.${note}`;
      if(b.hp<=0){ b.over="lost"; b.log=foe.lose; return s; }
      b.will=TUNING.will; drawCards(b,TUNING.draw);
      darken(b,b.snuffed?b.hand.length:foe.dark); b.snuffed=false;
      return s;
    }
    case "CLAIM":{
      if(!s.battle) return prev;
      const foe=s.battle.foe; s.mode="street"; s.battle=null;
      if(foe==="chandler"){
        s.found.push("candle"); s.chapelWon=true; s.lastFound={id:"candle",at:Date.now()};
        return say(s,"The Chandler is gone. One by one the candles on the altar take light, and the shapes in the pews sharpen into people: a lamplighter, a girl in a Sunday collar, a cooper with sawdust in his sleeves. People from the street, written over and kept here.\n\nNone of them look at you yet. But somewhere outside, by the well, someone heard you say your name.");
      }
      s.found.push("glance"); s.won=true; s.lastFound={id:"glance",at:Date.now()};
      return say(s,"The shade is gone. Across the street, Maren's head turns, slowly, until she is almost looking at you. A baker has appeared outside the bakery, frozen mid-step.");
    }
    case "RETREAT":{
      if(!s.battle) return prev;
      const foe=s.battle.foe, lost=s.battle.taken; s.found=s.found.filter(id=>!lost.includes(id)); s.mode="street"; s.battle=null;
      const names=lost.map(id=>CARDS[id].name.toLowerCase());
      const tail=names.length?` You've lost the ${names.join(" and the ")}; you'll have to find ${names.length>1?"them":"it"} again.`:" You kept everything you came in with.";
      if(foe==="chandler"){ s.player={...CHAPEL.entry}; return say(s,"You come to by the chapel door, and the dark is thicker than before."+tail); }
      return say(s,"You're on the cobbles again, and the street is thinner than before."+tail);
    }

  return prev;
}

/* ===== Store ===== */
let state=initialState(), path=[], pathTimer=null;
function dispatch(a){
  const n=reduce(state,a); if(n===state) return;
  const prev=state; state=n; render();
  if(prev.player!==n.player&&(prev.player.x!==n.player.x||prev.player.y!==n.player.y)) SFX.step(n.scene==="chapel"&&!n.chapelWon);
  if(prev.battle&&n.battle&&n.battle.taken.length>prev.battle.taken.length) SFX.thump();
}
const $=id=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== Sound (quiet; off until the first tap or key, and remembered per browser) ===== */
const SFX=(()=>{
  let ac=null, on=true, ready=false, amb=null, nb=null;
  try{ on=localStorage.getItem("ql-sound")!=="off"; }catch(e){}
  function ctx(){
    if(!on||!ready) return null;
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ac.state==="suspended") ac.resume();
    return ac;
  }
  function noise(a){ if(nb) return nb; nb=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nb; }
  function burst(when,gain,freq,dur){
    const a=ctx(); if(!a) return;
    const src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime+when;
    src.buffer=noise(a); f.type="lowpass"; f.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t+dur+0.05);
  }
  function stopAmb(){ if(!amb) return; const old=amb; amb=null; old.g.gain.setTargetAtTime(0,ac.currentTime,0.5); setTimeout(()=>old.nodes.forEach(n=>{try{n.stop()}catch(e){}}),2500); }
  function ambience(kind){
    if(amb&&amb.kind===kind) return; stopAmb();
    const a=ctx(); if(!a) return;
    const g=a.createGain(), nodes=[]; g.gain.value=0; g.connect(a.destination);
    if(kind==="street"){ const src=a.createBufferSource(), f=a.createBiquadFilter(); src.buffer=noise(a); src.loop=true; f.type="bandpass"; f.frequency.value=380; f.Q.value=0.6; src.connect(f).connect(g); src.start(); nodes.push(src); g.gain.setTargetAtTime(0.02,a.currentTime,1.5); }
    else { for(const fr of kind==="chapel"?[55,55.6,82.6]:[46,46.8]){ const o=a.createOscillator(); o.frequency.value=fr; o.connect(g); o.start(); nodes.push(o); } g.gain.setTargetAtTime(0.035,a.currentTime,1.5); }
    amb={kind,g,nodes};
  }
  return {
    get on(){ return on; },
    unlock(){ ready=true; },
    toggle(){ on=!on; try{ localStorage.setItem("ql-sound",on?"on":"off"); }catch(e){} if(!on) stopAmb(); },
    // in the dark chapel your footsteps come back a beat late, and now and then there's one more than yours
    step(echo){ burst(0,0.07,900,0.09); if(echo){ burst(0.42,0.04,650,0.1); if(Math.random()<0.18) burst(0.68,0.035,560,0.1); } },
    thump(){ burst(0,0.22,150,0.55); },
    ambience,
  };
})();
function syncSound(){
  SFX.ambience(state.mode==="battle"?"battle":state.scene==="chapel"&&!state.chapelWon?"chapel":"street");
  const b=$("sound"); b.textContent=SFX.on?"Sound on":"Sound off"; b.setAttribute("aria-pressed",SFX.on);
}

/* ===== The ledger writes on its own ===== */
const PHANTOM=["Don't say it out loud.","Count the people on the street. Count again.","Three winters.","It was warm when you left it.","Who is holding the pen?","You were here before.","It knows which cards are yours."];
function phantom(){
  const [lo,hi]=TUNING.phantomEveryMs; setTimeout(phantom,lo+Math.random()*(hi-lo));
  if(state.mode!=="street"||document.hidden) return;
  const empty=[...document.querySelectorAll("#entries li .t")].filter(t=>!t.textContent);
  if(!empty.length) return;
  const t=empty[Math.floor(Math.random()*empty.length)];
  t.textContent=PHANTOM[Math.floor(Math.random()*PHANTOM.length)]; t.classList.add("phantom");
  setTimeout(()=>{ if(t.classList.contains("phantom")){ t.textContent=""; t.classList.remove("phantom"); } },7000);
}

/* ===== Text rendering ===== */

function bar(n,max,cls){ return `<div class="bar ${cls}" aria-hidden="true">${Array.from({length:max},(_,i)=>`<span class="${i<n?"f":""}"></span>`).join("")}</div>`; }
function renderBattle(){

    <p class="log">${esc(b.log)}</p>

     return `<button class="card ${c.starter?"":"found"}" data-i="${i}" ${c.cost>b.will?"disabled":""}><span class="cost">${"●".repeat(c.cost)}</span><b>${c.name}</b><small>${c.battle}</small>${c.sight?`<i>Sight: ${c.sight}</i>`:""}</button>`}).join("")}</div>

  el.innerHTML=h;
  el.querySelectorAll(".card").forEach(x=>x.onclick=()=>dispatch({type:x.dataset.dark?"LIGHT":"PLAY",i:+x.dataset.i}));

/* ===== Street canvas ===== */
const cv=$("street"), g=cv.getContext("2d"), ov=$("over"), og=ov.getContext("2d"), T=TUNING.tile;
const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const qx=(x,y,w,h,c)=>{og.fillStyle=c;og.fillRect(x,y,w,h)};
const DRIFT=[[9,3],[10,3],[10,4],[9,4],[8,3],[8,4]];
function shadePos(t){ return shadeVisible(state)?[SPOT.shade.x,SPOT.shade.y]:DRIFT[Math.floor((reduced?0:t)/1500)%DRIFT.length]; }
function fadeIn(id,t){ const lf=state.lastFound; if(!lf||lf.id!==id||reduced) return 1; return Math.min(1,(Date.now()-lf.at)/1800); }

const lookAt=(from,to)=>[to.x>from.x?1:0,to.y<from.y?0:1];
// A brief, rare flash. Never under reduced motion.
const glimpse=(t,every,len)=>!reduced&&t>every&&(t%every)<len;

function sprite(ctx,x,y,c,alpha=1){
  const ox=x*T, oy=y*T, f=(a,b,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(ox+a,oy+b,w,h)};
  ctx.globalAlpha=alpha;
  f(4,15,8,1,"#00000033"); f(5,1,6,3,c.hair); f(5,4,6,4,c.face);
  if(c.eyes){ const [ex,ey]=c.eyes; f(5,5,2,2,"#f4f0e6"); f(9,5,2,2,"#f4f0e6"); f(5+ex,5+ey,1,1,"#111"); f(9+ex,5+ey,1,1,"#111"); }
  else { f(6,5,1,1,"#2a2a2a"); f(9,5,1,1,"#2a2a2a"); }
  f(4,8,8,6,c.coat); if(c.apron) f(5,9,6,5,c.apron); if(c.shawl){ f(3,8,10,3,c.shawl); }
  f(5,14,2,2,"#2a2420"); f(9,14,2,2,"#2a2420");
  if(c.quill){ f(12,6,1,5,"#e8e2d0"); f(12,11,1,1,"#1d2b4a"); }
  if(c.tray){ f(1,7,6,2,"#8a6a3a"); f(2,6,4,1,"#d2a35a"); }
  ctx.globalAlpha=1;
}

function drawStreet(t){
  const s=state, won=s.won;
  for(let y=3;y<8;y++)for(let x=0;x<12;x++){ px(x*T,y*T,T,T,"#7b7468"); px(x*T+2,y*T+3,5,3,"#6c655a"); px(x*T+9,y*T+9,5,3,"#6c655a"); px(x*T+4,y*T+11,2,1,"#8c8576"); }
  px(0,7*T,192,2,"#5e584e");
  // records
  px(0,4,64,8,"#39424c"); px(0,12,64,36,"#4f5d6b");
  px(6,20,14,12,"#2a3038"); px(6,25,14,2,"#7a6a50"); px(44,20,14,12,"#2a3038"); px(44,25,14,2,"#7a6a50");
  if(glimpse(t,21000,160)){ px(10,21,6,5,"#cfc6b4"); px(11,23,1,1,"#111"); px(14,23,1,1,"#111"); px(9,26,8,6,"#26335a"); }
  px(36,34,9,14,"#2c2620"); px(42,41,1,1,"#c9b27a");
  // bakery
  px(64,8,64,6,"#6b4a36"); px(64,14,64,34,"#c49a5a");
  for(let i=0;i<16;i++) px(64+i*4,24,4,6,i%2?"#e8dcc4":"#8e3b2f");
  px(70,33,18,11,"#3b2a1c"); if(won) px(72,35,14,7,"#e0a54a");
  px(100,34,9,14,"#5a3b26");
  // chapel
  px(128,14,64,34,"#a9a796"); px(128,10,64,5,"#5a5a4e"); px(146,0,28,16,"#a9a796"); px(146,0,28,2,"#5a5a4e");
  px(155,4,10,9,"#2e2a24"); px(157,5,6,7,"#b08a3a"); px(178,22,8,12,"#6c7f93"); px(134,22,8,12,"#6c7f93");
  if(won){ px(148,32,10,16,"#1a1410"); const fl=reduced?0:(Math.sin(t/180)>0?1:0); px(152,40,2,5,"#efe6cf"); px(152,37-fl,2,3,"#ffcf6b"); }
  else { const rattle=has(s,"coin")&&!reduced&&Math.floor(t/90)%23===0?1:0; px(148+rattle,32,10,16,"#4a3626"); px(155+rattle,40,1,1,"#c9b27a"); }
  // well
  { const ox=6*T, oy=5*T; px(ox+2,oy+3,12,11,"#8a8f94"); px(ox+4,oy+5,8,7,"#15181b"); px(ox+2,oy,2,4,"#5a4a3a"); px(ox+12,oy,2,4,"#5a4a3a"); px(ox+2,oy,12,1,"#5a4a3a"); px(ox+8,oy+1,1,5,"#c9b27a"); }
  // frost traces
  if(has(s,"coin")&&!won){
    const [sx,sy]=shadePos(t);
    for(const [fx,fy,a] of [[sx,sy,1],[sx,sy+1,.5]]){ if(fy>6) continue; g.globalAlpha=a*0.9;
      for(const [dx,dy] of [[3,4],[9,3],[6,9],[12,11],[2,12],[10,7]]) px(fx*T+dx,fy*T+dy,2,1,"#dfeaf2"); g.globalAlpha=1; }
  }
  // people
  if(won){ const b=s.baker; sprite(g,b.x,b.y,{hair:"#d7cfbf",face:"#d9a982",coat:"#7a5b3c",apron:"#ece6d6",tray:true,eyes:lookAt(b,s.player)},0.8); }
  if(has(s,"flower")){
    let eyes=[0,0];
    if(!won){ const [sx,sy]=shadePos(t); eyes=[Math.sign(sx-SPOT.maren.x)>0?1:0, sy<SPOT.maren.y?0:1]; }
    else { eyes=[s.player.x>SPOT.maren.x?1:0, s.player.y<SPOT.maren.y?0:1]; }
    sprite(g,SPOT.maren.x,SPOT.maren.y,{hair:"#6b3a26",face:"#e6c6ae",coat:"#3f5244",shawl:"#8d97a0",eyes},fadeIn("flower",t));
  }
  // clerk (a little less there than everyone else)
  const flick=reduced?0.75:0.7+0.08*Math.sin(t/400);
  sprite(g,s.player.x,s.player.y,{hair:"#3a2a1e",face:"#e0b894",coat:"#26335a",quill:true},won?0.85:flick);
  if(won) for(const lx of [0,11]){ const ox=lx*T, oy=4*T; px(ox+7,oy-2,2,16,"#3a3a3a"); px(ox+5,oy-6,6,4,"#ffd27a"); }
  else for(let y=0;y<8;y++)for(let x=0;x<12;x++){
    if(x>=1&&x<=10&&y<=6) continue; px(x*T,y*T,T,T,"#2b3137");
    const seed=reduced?0:Math.floor(t/140); for(let k=0;k<3;k++){ const h=(x*73+y*151+k*37+seed*11)%256; px(x*T+(h%16),y*T+((h>>4)%16),1,1,"#4a525a"); }
  }
}

function drawOver(t){
  og.clearRect(0,0,192,128);
  const s=state, pulse=reduced?0.25:0.16+0.14*(0.5+0.5*Math.sin(t/320)), blink=reduced||Math.floor(t/500)%2;
  if(pickupAvailable(s,"flower")){ const ox=3*T, oy=4*T; halo(3,4,pulse); qx(ox+7,oy+6,1,6,"#5f7a3a"); qx(ox+5,oy+5,5,3,"#8a5aa8"); qx(ox+6,oy+4,3,1,"#a57ac2"); if(blink) qx(ox+7,oy+6,1,1,"#fff"); }
  if(pickupAvailable(s,"coin")){ const ox=6*T, oy=5*T; qx(ox+5,oy+6,6,5,`rgba(170,210,255,${pulse})`); qx(ox+7,oy+8,2,2,"#cfe3f5"); if(blink) qx(ox+7,oy+8,1,1,"#fff"); }
  if(pickupAvailable(s,"ribbon")){ const ox=10*T, oy=5*T; halo(10,5,pulse); qx(ox+2,oy+8,2,2,"#c0392b"); qx(ox+4,oy+9,7,2,"#c0392b"); qx(ox+5,oy+8,3,1,"#e8644f"); qx(ox+11,oy+8,3,3,"#1a1a1a"); if(blink) qx(ox+13,oy+8,1,1,"#ff9a3c"); }
  if(shadeVisible(s)){
    const ox=SPOT.shade.x*T, oy=SPOT.shade.y*T, a=fadeIn("ribbon",t)*(reduced?0.85:0.7+0.2*Math.sin(t/230)), sway=reduced?0:Math.round(Math.sin(t/500));
    og.globalAlpha=a;
    qx(ox+3+sway,oy-14,10,28,"#1c1a1f"); qx(ox+5+sway,oy-18,6,6,"#1c1a1f"); qx(ox+1,oy+6,14,8,"#1c1a1fcc");
    qx(ox+4+sway,oy-10,8,2,"#d8cfa8"); qx(ox+6+sway,oy-15,1,1,"#f0ead0"); qx(ox+9+sway,oy-15,1,1,"#f0ead0");
    og.globalAlpha=1;
  }
}
/* ===== Chapel canvas ===== */
function drawChapel(t){
  const s=state, lit=s.chapelWon, fl=reduced?0:(Math.sin(t/180)>0?1:0);
  px(0,0,192,128,"#2e2b27");
  // back wall, window, altar
  px(16,0,160,32,"#46423a");
  for(let i=0;i<14;i++) px(16+(i*37)%150,4+(i*11)%24,10,1,"#3c3832");
  px(84,1,24,22,"#2a2d33");
  const panes=lit?["#9a5a72","#5a7a9c","#6f9a5a","#b0904a"]:["#5a4650","#46505c","#4c5a46","#5c5646"];
  px(86,3,9,9,panes[0]); px(97,3,9,9,panes[1]); px(86,13,9,8,panes[2]); px(97,13,9,8,panes[3]);
  px(78,18,36,14,"#6a5a48"); px(78,18,36,4,"#e4ddc8");
  for(let k=0;k<6;k++){ const cx=81+k*6, h=3+(k*5)%4; px(cx,18-h,2,h,"#e8e2cc"); if(lit) px(cx,15-h-fl*(k%2),2,3,"#ffcf6b"); }
  // floor, aisle runner, door
  for(let y=2;y<7;y++)for(let x=1;x<11;x++){ px(x*T,y*T,T,T,"#57524a"); px(x*T,y*T,T,1,"#4a463f"); px(x*T,y*T,1,T,"#4a463f"); }
  px(5*T+4,2*T,24,5*T,"#5e2e2a"); px(5*T+5,2*T,22,5*T,"#6a3430");
  px(80,112,32,16,"#8a8578"); px(80,112,32,2,"#a9a28f"); px(78,108,2,20,"#3a3630"); px(112,108,2,20,"#3a3630");
  // candle stand
  { const ox=CHAPEL.stand.x*T, oy=CHAPEL.stand.y*T;
    px(ox+7,oy+4,2,11,"#3a3a3a"); px(ox+3,oy+3,10,2,"#3a3a3a"); px(ox+4,oy+14,8,2,"#3a3a3a");
    px(ox+4,oy,1,3,"#e8e2cc"); px(ox+11,oy,1,3,"#e8e2cc"); px(ox+7,oy-1,2,4,"#efe6cf"); px(ox+7,oy-4-fl,2,3,"#ffcf6b");
    if(!has(s,"taper")) px(ox+2,oy+12,10,1,"#efe6cf"); }
  // lectern and register
  { const ox=CHAPEL.lectern.x*T, oy=CHAPEL.lectern.y*T;
    px(ox+6,oy+6,4,9,"#5a3b26"); px(ox+3,oy+14,10,2,"#4a301f");
    px(ox+2,oy+2,12,5,"#d8d0b8"); px(ox+7,oy+2,1,5,"#8a7a60");
    if(!has(s,"name")) px(ox+3,oy+3,10,3,"#ece2c4"); else for(let r=0;r<3;r++){ px(ox+3,oy+3+r,3,1,"#5a5246"); px(ox+9,oy+3+r,3,1,"#5a5246"); } }
  // pews, then the people in them
  for(const [x,y] of CHAPEL.pews){ const ox=x*T, oy=y*T; px(ox,oy+3,T,3,"#4a301f"); px(ox,oy+9,T,3,"#5a3b26"); px(ox+1,oy+12,2,4,"#3a2618"); px(ox+13,oy+12,2,4,"#3a2618"); }
  const ghostA=lit?0.9:(has(s,"name")?0.3:0.16)+(reduced?0:0.05*Math.sin(t/600));
  for(const gh of CHAPEL.ghosts) if(gh.look) sprite(g,gh.x,gh.y,lit?gh.look:{...gh.look,eyes:lookAt(gh,s.player)},ghostA*(lit?fadeIn("candle",t):1));
  if(!lit&&glimpse(t,17000,130)){ px(98,5,7,7,"#d8d2c2"); px(99,7,2,2,"#111"); px(103,7,2,2,"#111"); px(100,10,3,1,"#3a2a2a"); }
  // clerk: more solid once you have your name back
  const flick=reduced?0.75:0.7+0.08*Math.sin(t/400);
  sprite(g,s.player.x,s.player.y,{hair:"#3a2a1e",face:"#e0b894",coat:"#26335a",quill:true},has(s,"name")?0.92:flick);
}

function drawChapelOver(t){
  og.clearRect(0,0,192,128);
  const s=state, pulse=reduced?0.25:0.16+0.14*(0.5+0.5*Math.sin(t/320));
  if(!s.chapelWon){
    // the dark: you only see what's near you, near the one candle, and near the door
    const r=has(s,"taper")?3.2:1.6, pl=s.player;
    for(let y=0;y<8;y++)for(let x=0;x<12;x++){
      const fall=(cx,cy,rad)=>Math.max(0,(Math.hypot(x-cx,y-cy)-rad)*0.32);
      const a=Math.min(0.88,fall(pl.x,pl.y,r),fall(CHAPEL.stand.x,CHAPEL.stand.y,1),fall(5.5,7,0.8));
      if(a>0) qx(x*T,y*T,T,T,`rgba(8,8,12,${a})`);
    }
  }
  if(!has(s,"name")){
    const pl=s.player, m={x:11-pl.x,y:pl.y}, d=Math.abs(m.x-pl.x);
    if(d>=3) sprite(og,m.x,m.y,{hair:"#3a2a1e",face:"#e0b894",coat:"#26335a",quill:true,eyes:lookAt(m,pl)},reduced?0.22:0.16+0.08*Math.sin(t/300));
  }
  if(pickupAvailable(s,"taper")) halo(CHAPEL.stand.x,CHAPEL.stand.y,pulse);
  if(pickupAvailable(s,"name")) halo(CHAPEL.lectern.x,CHAPEL.lectern.y,pulse);
  if(chandlerVisible(s)){
    const ox=CHAPEL.chandler.x*T, oy=CHAPEL.chandler.y*T, sway=reduced?0:Math.round(Math.sin(t/650)), fl=reduced?0:(Math.sin(t/150)>0?1:0);
    og.globalAlpha=fadeIn("name",t);
    qx(ox+3,oy-12,10,27,"#3b3026"); qx(ox+5,oy-4,6,17,"#d8cfb8");
    qx(ox+4+sway,oy-18,8,7,"#cdc2a4"); qx(ox+6+sway,oy-15,1,1,"#111"); qx(ox+9+sway,oy-15,1,1,"#111");
    qx(ox+5+sway,oy-11,1,3,"#efe6cf"); qx(ox+10+sway,oy-11,1,2,"#efe6cf");
    qx(ox+13,oy-6,2,7,"#efe6cf"); qx(ox+13,oy-9-fl,2,3,"#ffcf6b"); qx(ox,oy-4,3,2,"#2a2a2a"); qx(ox-1,oy-6,2,3,"#2a2a2a");
    og.globalAlpha=1;
  }
}
function halo(x,y,pulse){ qx(x*T-1,y*T+5,18,9,`rgba(255,120,90,${pulse*0.6})`); qx(x*T+1,y*T+6,14,7,`rgba(255,120,90,${pulse})`); }

function loop(t){
  if(state.mode!=="battle"){ if(state.scene==="chapel"){ drawChapel(t); drawChapelOver(t); } else { drawStreet(t); drawOver(t); } }
  requestAnimationFrame(loop);
}

/* ===== Input ===== */
const wake=()=>{ SFX.unlock(); syncSound(); };
addEventListener("pointerdown",wake,{once:true}); addEventListener("keydown",wake,{once:true});
$("sound").onclick=()=>{ SFX.toggle(); syncSound(); };
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
addEventListener("keydown",e=>{
  if(state.mode!=="street"||e.target.tagName==="BUTTON") return;
  const k=KEYS[e.key]; if(!k) return; e.preventDefault(); stopPath(); dispatch({type:"STEP",dx:k[0],dy:k[1]});
});
function stopPath(){ path=[]; clearInterval(pathTimer); pathTimer=null; }
function findPath(tx,ty){
  const s=state, goals=new Set(), N=[[0,1],[0,-1],[1,0],[-1,0]];
  if(walkable(tx,ty,s)) goals.add(tx+","+ty); else for(const [dx,dy] of N) if(walkable(tx+dx,ty+dy,s)) goals.add((tx+dx)+","+(ty+dy));
  const start=s.player.x+","+s.player.y, prev={[start]:null}, q=[start];
  while(q.length){ const cur=q.shift();
    if(goals.has(cur)){ const out=[]; let c=cur; while(c!==start){ out.unshift(c.split(",").map(Number)); c=prev[c]; } return out; }
    const [x,y]=cur.split(",").map(Number);
    for(const [dx,dy] of N){ const n=(x+dx)+","+(y+dy); if(!(n in prev)&&walkable(x+dx,y+dy,s)){ prev[n]=cur; q.push(n); } } }
  return null;
}
cv.addEventListener("click",e=>{
  if(state.mode!=="street") return;
  const r=cv.getBoundingClientRect(), tx=Math.floor((e.clientX-r.left)/r.width*TUNING.cols), ty=Math.floor((e.clientY-r.top)/r.height*TUNING.rows);
  stopPath(); const p=findPath(tx,ty); if(!p) return;
  const target=thingAt(tx,ty,state); path=p; let moved=false;
  const step=()=>{
    if(state.mode!=="street"||(moved&&state.say.choices.length)){ stopPath(); return; }
    const nx=path.shift();
    if(nx&&Math.abs(nx[0]-state.player.x)+Math.abs(nx[1]-state.player.y)!==1){ stopPath(); return; }
    if(nx){ moved=true; dispatch({type:"STEP",dx:nx[0]-state.player.x,dy:nx[1]-state.player.y}); return; }
    stopPath();
    if(target&&Math.abs(tx-state.player.x)+Math.abs(ty-state.player.y)===1) dispatch({type:"STEP",dx:tx-state.player.x,dy:ty-state.player.y});
  };
  if(!path.length) step(); else pathTimer=setInterval(step,TUNING.stepMs);
});
render(); requestAnimationFrame(loop);
setTimeout(phantom,12000);
</script>
